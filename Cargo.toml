[package]
name = "my_clipboard_playlist"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7"] }
anyhow = "1.0.104"
async-channel = "2.5.0"
base64 = "0.23.1"
ehttp = { version = "0.7.1", default-features = false }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_18"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
url = "2.5.8"
